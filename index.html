<style>
/* 2.0 大地暖陽心善版配色 */
:root{
  --bg:#FAF7F2;      /* 晨光米白 / 暖燕麥色主背景 */
  --pn:#FFFFFF;      /* 純淨白面板與卡片 */
  --p2:#F5EFE6;      /* 次要按鈕與淺色區塊 */
  --tx:#332E2A;      /* 深焙咖啡棕主文字（取代生硬純黑） */
  --sb:#6E655F;      /* 暖灰棕說明文字 */
  --ln:#E8E0D5;      /* 柔和暖灰邊框 */
  --rd:#E07A38;      /* 暖陽琥珀橘（核心按鈕與選取重點色） */
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1B18;--pn:#26221E;--p2:#332D28;--tx:#F5EFE6;--sb:#A69B93;--ln:#423A34;--rd:#E07A38;
    color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#1E1B18;--pn:#26221E;--p2:#332D28;--tx:#F5EFE6;--sb:#A69B93;--ln:#423A34;--rd:#E07A38;
  color-scheme:dark
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{position:relative;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.4 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:6px}.row[hidden]{display:none}
.b{pointer-events:auto;border:1px solid var(--ln);border-radius:12px;padding:8px 12px;background:var(--pn);color:var(--tx);font:inherit;cursor:pointer;transition:all .2s ease}
.b.on{background:var(--rd);border-color:var(--rd);color:#fff}.b:disabled{opacity:.4;cursor:default}
.tip{font-size:12px;color:var(--sb)}
.panel{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:min(640px,calc(100% - 16px));box-sizing:border-box;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:12px 16px;box-shadow:0 8px 24px rgba(51,46,42,.06)}
.lb{font-size:12px;color:var(--sb);margin-bottom:6px}
.panel .b{background:var(--p2)}.panel .b.on{background:var(--rd);color:#fff}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);padding:0;cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--pn),0 0 0 4px var(--rd)}
.md{position:absolute;inset:0;background:rgba(51,46,42,.4);display:flex;align-items:center;justify-content:center;padding:16px}.md[hidden]{display:none}
.mc{background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:16px;width:min(420px,100%);max-height:80%;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 32px rgba(51,46,42,.12)}
.mc input{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--p2);color:var(--tx)}
.mi{display:flex;gap:6px;align-items:center}.mi span{flex:1}
#mq{position:absolute;border:1.5px dashed var(--rd);background:rgba(224,122,56,.12);pointer-events:none}#mq[hidden]{display:none}
</style>
